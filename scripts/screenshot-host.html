<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Marcy screenshot host</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0a0a0a; color: #666; }
  </style>
</head>
<body>
<script>
  (async () => {
    try {
      const response = await fetch(`/__scenario?ts=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`scenario request failed (${response.status})`);
      const scenario = await response.json();
      localStorage.clear();
      localStorage.setItem('marcy_data', JSON.stringify(scenario.data));
      window.location.replace(scenario.path);
    } catch (error) {
      document.body.textContent = `Screenshot setup failed: ${error.message}`;
    }
  })();
</script>
</body>
</html>
