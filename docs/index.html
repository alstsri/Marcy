<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<title>marcy</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; font-weight: 300; src: url('fonts/jbm-300.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('fonts/jbm-400.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('fonts/jbm-500.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url('fonts/jbm-600.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('fonts/jbm-700.ttf') format('truetype'); font-display: swap; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --text: #e0e0e0;
    --text-dim: #666666;
    --text-muted: #444444;
    --accent: #ffffff;
    --red: #ff3b30;
    --orange: #ff9500;
    --green: #30d158;
    --blue: #0a84ff;
    --yellow: #ffd60a;
  }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: env(safe-area-inset-top);
    background: var(--bg);
    pointer-events: none;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(24px, calc(env(safe-area-inset-top) + 16px)) 20px max(72px, calc(env(safe-area-inset-bottom) + 72px));
    min-height: 100vh;
  }

  @media (min-width: 768px) {
    body.native-app .app,
    body.native-app .bottom-nav {
      max-width: 720px;
    }

    body.native-app .app {
      padding-top: max(40px, calc(env(safe-area-inset-top) + 16px));
    }
  }

  /* Header */
  .header {
    margin-bottom: 40px;
  }
  .header h1 {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* Phase Banner */
  .phase-banner {
    padding: 16px 20px;
    border-left: 3px solid var(--text-muted);
    margin-bottom: 32px;
    background: var(--surface);
  }
  .phase-banner.fertile {
    border-left-color: var(--red);
    background: #1a0a0a;
  }
  .phase-banner.pms {
    border-left-color: var(--orange);
    background: #1a1400;
  }
  .phase-banner.late {
    border-left-color: var(--blue);
    background: #0a0a1a;
  }
  .phase-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .phase-banner.fertile .phase-label { color: var(--red); }
  .phase-banner.pms .phase-label { color: var(--orange); }
  .phase-banner.late .phase-label { color: var(--blue); }
  .phase-sub {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Cycle Day Ring */
  .ring-section {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 40px;
  }
  .ring-container {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }
  .ring-container svg {
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: var(--surface2);
    stroke-width: 4;
  }
  .ring-progress {
    fill: none;
    stroke: var(--text-dim);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
  }
  .ring-progress.fertile { stroke: var(--red); }
  .ring-progress.pms { stroke: var(--orange); }
  .ring-progress.late { stroke: var(--blue); }
  .ring-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-day {
    font-size: 32px;
    font-weight: 300;
    color: var(--accent);
    line-height: 1;
  }
  .ring-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .ring-meta {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 2;
  }
  .ring-meta span {
    color: var(--text);
  }

  /* Timeline */
  .timeline {
    margin-bottom: 40px;
  }
  .timeline-title, .timeline-note {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .timeline-note { margin: 16px 0 0; line-height: 1.8; }
  .timeline-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .timeline-row:last-child { border-bottom: none; }
  .tl-event {
    font-size: 13px;
    color: var(--text);
  }
  .tl-date {
    font-size: 12px;
    color: var(--text-dim);
  }
  .tl-countdown {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .tl-countdown.soon { color: var(--orange); background: #1a1400; }
  .tl-countdown.danger { color: var(--red); background: #1a0a0a; }
  .tl-countdown.active { color: var(--red); background: #1a0a0a; font-weight: 700; }

  /* Log Form */
  .log-section {
    margin-bottom: 40px;
  }
  .log-form {
    display: flex;
    gap: 8px;
  }
  .log-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  .log-input:focus {
    border-color: var(--text-dim);
  }
  .log-input::placeholder {
    color: var(--text-muted);
  }
  .log-input::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
    cursor: pointer;
  }
  .log-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .log-btn:hover { opacity: 0.85; }
  .log-btn:active { opacity: 0.7; }

  .toast {
    position: fixed;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast-undo { pointer-events: auto; background: none; border: none; color: var(--yellow); font: inherit; text-decoration: underline; min-height: 44px; padding: 0 10px; margin-left: 8px; cursor: pointer; }
  .heat-details .history-del { min-width: 44px; min-height: 44px; }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* History */
  .history-section { margin-bottom: 40px; }
  .history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-date { color: var(--text); }
  .history-len { color: var(--text-dim); }
  .history-del {
    color: var(--text-muted);
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 2px;
    transition: color 0.2s;
  }
  .history-del:hover { color: var(--red); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stat-row span { color: var(--text); }

  /* Tension Alert */
  .tension-alert {
    padding: 16px 20px;
    border-left: 3px solid var(--yellow);
    background: #1a1800;
    margin-bottom: 32px;
  }
  .tension-alert .phase-label { color: var(--yellow); }
  .tension-alert .phase-sub { color: var(--text-dim); }

  /* Recorded tension: fixed color scale, with counts and coverage in every cell. */
  .tension-map { margin-bottom: 32px; }
  .heat-note { font-size: 11px; line-height: 1.7; color: var(--text-dim); margin: 10px 0; }
  .heat-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 12px 0; }
  .heat-cell { min-height: 48px; padding: 5px 1px; border: 1px solid var(--border); border-radius: 4px; font: inherit; font-size: 11px; color: var(--text); background: var(--surface2); cursor: pointer; }
  .heat-cell small { display: block; font-size: 9px; margin-top: 5px; }
  .heat-cell[data-level="1"] { background: #453d20; }
  .heat-cell[data-level="2"] { background: #65531b; }
  .heat-cell[data-level="3"] { background: #977926; color: #fff; }
  .heat-cell[data-level="4"] { background: var(--yellow); color: #111; }
  .heat-cell.no-coverage { background: transparent; border-style: dashed; color: var(--text-dim); }
  .heat-cell[aria-pressed="true"], .heat-cell:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .heat-cell.zero-events { color: var(--text-dim); background: transparent; }
  .heat-cell.is-today { border-color: #8b7541; box-shadow: inset 0 0 0 1px #8b754155; }
  .heat-mode { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); font: inherit; font-size: 11px; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
  .today-btn.heat-history-btn { margin-bottom: 8px; }
  .today-card.heat-details { margin-top: 0; margin-bottom: 0; font-size: 11px; line-height: 1.7; }
  .heat-details ul { padding: 0; margin: 0; list-style: none; max-height: 220px; overflow: auto; }
  .heat-details li { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .heat-details time { white-space: nowrap; }

  /* Today Card */
  .today-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    padding: 14px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 40px;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .today-btn:hover { border-color: var(--text-dim); background: var(--surface2); }
  .today-btn .today-arrow {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .today-btn.open .today-arrow { transform: rotate(90deg); }
  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    margin-top: -32px;
    margin-bottom: 40px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .today-section-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }
  .today-section-label:first-of-type { margin-top: 0; }
  .today-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .today-text strong {
    color: var(--text);
    font-weight: 500;
  }

  /* Onboarding */
  .onboard {
    padding: 40px 0;
  }
  .onboard-title {
    font-size: 16px;
    font-weight: 300;
    color: var(--accent);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .onboard-text {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 32px;
  }
  .onboard-field {
    margin-bottom: 20px;
  }
  .onboard-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .onboard-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .onboard-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .onboard-btn {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 14px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .onboard-btn:hover { opacity: 0.85; }
  .onboard-btn:active { opacity: 0.7; }
  .onboard-skip {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 12px;
    margin-top: 4px;
  }
  .onboard-skip:hover { color: var(--text-dim); }

  /* Confirm Dialog */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.15s ease;
  }
  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    max-width: 300px;
    width: 90%;
    text-align: center;
  }
  .confirm-msg {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .confirm-actions {
    display: flex;
    gap: 8px;
  }
  .confirm-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
  }
  .confirm-cancel {
    background: var(--surface2);
    color: var(--text-dim);
  }
  .confirm-delete {
    background: var(--red);
    color: var(--bg);
  }
  .confirm-ok {
    background: var(--surface2);
    border: 1px solid var(--text-dim);
    color: var(--text);
  }

  /* Late period prompt */
  .late-prompt {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 32px;
  }
  .late-prompt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .late-prompt-text {
    font-size: 12px;
    color: var(--text-dim);
  }
  .late-prompt-extra {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .late-prompt-btn {
    background: var(--blue);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  .late-prompt-btn:hover { opacity: 0.85; }

  /* Learning note */
  .learning-note {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.8;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 32px;
  }
  .learning-note strong {
    color: var(--text-dim);
    font-weight: 500;
  }

  /* Email prompt */
  .email-prompt {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 32px;
  }
  .email-prompt-text {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .email-prompt-form {
    display: flex;
    gap: 8px;
  }
  .email-prompt-skip {
    display: block;
    text-align: center;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    margin-top: 4px;
  }
  .email-prompt-skip:hover { color: var(--text-dim); }

  /* Settings */
  .settings-section {
    margin-bottom: 40px;
  }
  .settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { color: var(--text-dim); }
  .settings-value {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-input {
    width: 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    text-align: center;
    outline: none;
  }
  .settings-input:focus { border-color: var(--text-dim); }
  .settings-save {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .settings-save:hover { color: var(--text); border-color: var(--text-dim); }

  /* Backup */
  .backup-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .backup-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .backup-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .backup-file { display: none; }

  /* Terms */
  .terms {
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.8;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .terms-toggle {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s;
  }
  .terms-toggle:hover { color: var(--text-dim); }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 50;
    max-width: 480px;
    margin: 0 auto;
  }
  .nav-tab {
    flex: 1;
    padding: 14px 0 max(14px, env(safe-area-inset-bottom));
    text-align: center;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.2s;
  }
  .nav-tab.active {
    color: var(--text);
  }
  .nav-tab:hover {
    color: var(--text-dim);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px 0;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .footer a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; color: inherit; text-decoration: none; }
  .footer a:hover, .footer a:focus-visible { color: var(--text); text-decoration: underline; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 2;
  }

  /* Sections */
  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* Mobile tweaks */
  @media (max-width: 400px) {
    .app { padding: 16px 16px 72px; }
    .ring-section { gap: 20px; }
    .ring-container { width: 100px; height: 100px; }
    .ring-day { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>marcy</h1>
  </div>

  <div id="content">
    <div class="empty">loading...</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="confirm-root"></div>

  <nav class="bottom-nav" id="bottom-nav" style="display:none">
    <button class="nav-tab active" data-view="dashboard" onclick="switchView('dashboard')">dashboard</button>
    <button class="nav-tab" data-view="manage" onclick="switchView('manage')">data</button>
  </nav>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────
const FORMSPREE_URL = 'https://formspree.io/f/mdayreqr';

// ── Data Layer (localStorage) ───────────────────────────────────
const STORAGE_KEY = 'marcy_data';
const DEFAULT_DATA = {
  periods: [],
  tensions: [],
  settings: { default_cycle_length: 28, manual_cycle_length: null },
  onboarded: false,
  email_prompted: false,
  email: null,
  paused: false,
  partner_name: null,
  period_ends: {},
};

function parseStoredData(raw) {
  const d = JSON.parse(raw);
  // Older installations could contain future entries; keep them available to correct.
  validateBackup(d, true);
  return { ...structuredClone(DEFAULT_DATA), ...d,
    settings: { ...DEFAULT_DATA.settings, ...d.settings }, period_ends: d.period_ends || {} };
}

class StorageReadError extends Error {}
window.addEventListener('error', event => {
  if (event.error instanceof StorageReadError) {
    event.preventDefault();
    renderRecovery();
  }
});

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw === null ? structuredClone(DEFAULT_DATA) : parseStoredData(raw);
  } catch { throw new StorageReadError('Saved data unavailable'); }
}

function saveData(data, { restore = false } = {}) {
  try {
    const next = JSON.stringify(data);
    parseStoredData(next);
    const previous = localStorage.getItem(STORAGE_KEY);
    if (previous !== null) {
      try { parseStoredData(previous); }
      catch {
        if (!restore) { renderRecovery(); return false; }
        // Preserve exact unreadable bytes before a confirmed backup restore.
        const key = STORAGE_KEY + '_recovery_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem(key, previous);
      }
    }
    localStorage.setItem(STORAGE_KEY, next);
  } catch {
    toast('could not save — existing data kept', true);
    return false;
  }
  undoButton?.remove();
  undoButton = null;
  scheduleNotifications();
  return true;
}

function renderRecovery() {
  const nav = document.getElementById('bottom-nav');
  if (nav) nav.style.display = 'none';
  dismissConfirm();
  $('#content').innerHTML = `<div class="empty">couldn’t read saved data.<br>Your records have not been replaced.</div>
    <div class="backup-row"><button class="backup-btn" id="recovery-download">download saved data</button><button class="backup-btn" id="recovery-import">restore backup</button><button class="backup-btn" id="recovery-retry">try again</button></div>
    <input type="file" accept=".json" class="backup-file" id="recovery-file">
    <div class="footer"><a href="support.html">support</a></div>`;
  $('#recovery-retry').addEventListener('click', () => render());
  $('#recovery-import').addEventListener('click', () => $('#recovery-file').click());
  $('#recovery-file').addEventListener('change', event => { if (event.target.files[0]) importData(event.target.files[0]); });
  $('#recovery-download').addEventListener('click', () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) throw new Error('No saved data');
      const url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `marcy-recovery-${isoDate(new Date())}.json`;
      link.click();
      URL.revokeObjectURL(url);
    } catch { toast('could not download — try again', true); }
  });
}

// ── Export / Import ─────────────────────────────────────────────
function exportData() {
  const data = { ...loadData(), schema_version: 1 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `marcy-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('backup downloaded');
}

// Backups are untrusted input. Build a new, allowlisted object before storage.
const MAX_BACKUP_BYTES = 1024 * 1024;
function validateBackup(input, allowFutureDates = false) {
  const fail = () => { throw new Error('invalid backup file'); };
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  if (!object(input) || (input.schema_version !== undefined && input.schema_version !== 1)) fail();
  const today = isoDate(new Date());
  const validDate = value => {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    return isoDate(parseDate(value)) === value && (allowFutureDates || value <= today);
  };
  const dates = value => {
    if (!Array.isArray(value) || value.length > 10000 || !value.every(validDate) || new Set(value).size !== value.length) fail();
    return [...value].sort();
  };
  const text = (value, limit) => {
    if (value === undefined || value === null) return null;
    if (typeof value !== 'string' || value.length > limit) fail();
    return value;
  };
  const flag = (value, fallback = false) => {
    if (value === undefined) return fallback;
    if (typeof value !== 'boolean') fail();
    return value;
  };
  const cycle = value => {
    if (!Number.isInteger(value) || value < 18 || value > 45) fail();
    return value;
  };
  const settings = input.settings === undefined ? {} : input.settings;
  if (!object(settings)) fail();
  const ends = input.period_ends === undefined ? {} : input.period_ends;
  if (!object(ends) || Object.keys(ends).length > 10000) fail();
  const periodEnds = {};
  for (const [start, end] of Object.entries(ends)) {
    if (!validDate(start) || !validDate(end) || end < start) fail();
    periodEnds[start] = end;
  }
  return {
    schema_version: 1,
    periods: dates(input.periods),
    tensions: dates(input.tensions === undefined ? [] : input.tensions),
    settings: {
      default_cycle_length: cycle(settings.default_cycle_length === undefined ? 28 : settings.default_cycle_length),
      manual_cycle_length: settings.manual_cycle_length == null ? null : cycle(settings.manual_cycle_length),
    },
    onboarded: flag(input.onboarded),
    email_prompted: flag(input.email_prompted),
    email: text(input.email, 320),
    paused: flag(input.paused),
    partner_name: text(input.partner_name, 200),
    period_ends: periodEnds,
  };
}

function importData(file) {
  if (file.size > MAX_BACKUP_BYTES) { toast('backup file is too large', true); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('could not read backup file', true);
  reader.onload = (e) => {
    let data;
    try {
      data = validateBackup(JSON.parse(e.target.result));
      data.onboarded = true;
    } catch {
      toast('invalid backup file', true);
      return;
    }
    showConfirm(
      'This will replace your current history.<br><span style="font-size:11px;color:var(--text-dim)">Your period dates, tension events, and settings will be replaced with the contents of this backup.</span>',
      () => {
        if (!saveData(data, { restore: true })) return;
        toast(`restored ${data.periods.length} period${data.periods.length !== 1 ? 's' : ''}`);
        render();
      },
      'replace history'
    );
  };
  reader.readAsText(file);
}

// ── Confirm Dialog ──────────────────────────────────────────────
function showConfirm(msg, onConfirm, confirmLabel = 'delete', confirmClass = 'confirm-delete') {
  const root = document.getElementById('confirm-root');
  root.innerHTML = `
    <div class="confirm-overlay" onclick="if(event.target===this)dismissConfirm()">
      <div class="confirm-box">
        <div class="confirm-msg">${msg}</div>
        <div class="confirm-actions">
          <button class="confirm-cancel" onclick="dismissConfirm()">cancel</button>
          <button class="${confirmClass}" id="confirm-yes">${confirmLabel}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirm-yes').addEventListener('click', () => {
    dismissConfirm();
    onConfirm();
  });
}

function dismissConfirm() {
  document.getElementById('confirm-root').innerHTML = '';
}

// ── Cycle Math ──────────────────────────────────────────────────
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function dayOfYear() {
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
}

function getAutoCycleLength(data) {
  const periods = [...data.periods].sort();
  if (periods.length < 2) return data.settings.default_cycle_length;
  const diffs = [];
  for (let i = 1; i < periods.length; i++) {
    const d = daysBetween(parseDate(periods[i - 1]), parseDate(periods[i]));
    if (d >= 18 && d <= 45) diffs.push(d);
  }
  if (!diffs.length) return data.settings.default_cycle_length;
  if (diffs.length === 1) return diffs[0];
  let weightedSum = 0, totalWeight = 0;
  for (let i = 0; i < diffs.length; i++) {
    const weight = i + 1;
    weightedSum += diffs[i] * weight;
    totalWeight += weight;
  }
  return Math.round(weightedSum / totalWeight);
}

function getCycleLength(data) {
  if (data.settings.manual_cycle_length) return data.settings.manual_cycle_length;
  return getAutoCycleLength(data);
}

function getCycleLengthType(data) {
  if (data.settings.manual_cycle_length) return 'manual';
  if (data.periods.length < 2) return 'default';
  return 'calculated';
}

function getPredictions(data) {
  const periods = [...data.periods].sort();
  if (!periods.length) return null;
  const lastStart = parseDate(periods[periods.length - 1]);
  const cycleLen = getCycleLength(data);
  const nextPeriod = addDays(lastStart, cycleLen);
  const ovulationDay = addDays(nextPeriod, -14);
  const fertileStart = addDays(ovulationDay, -4);
  const fertileEnd = addDays(ovulationDay, 1);
  const pmsStart = addDays(nextPeriod, -7);
  return { lastPeriod: lastStart, cycleLength: cycleLen, nextPeriod, ovulationDay, fertileStart, fertileEnd, pmsStart };
}

function getTensionAnalysis(data) {
  const today = isoDate(new Date());
  const valid = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && isoDate(parseDate(value)) === value && value <= today;
  const periods = [...new Set(data.periods.filter(valid))].sort();
  const tensions = [...new Set((data.tensions || []).filter(valid))].sort();
  const eventDates = new Set(tensions);
  const cycles = periods.slice(0, -1).map((start, i) => ({
    start, end: periods[i + 1], length: daysBetween(parseDate(start), parseDate(periods[i + 1])),
  }));
  const start = periods[periods.length - 1];
  const current = start ? { start, length: daysBetween(parseDate(start), parseDate(today)) + 1 } : null;
  const averageLength = getAutoCycleLength(data);
  const estimated = periods.length ? tensions.filter(date => date < periods[0]).map(date => {
    const offset = daysBetween(parseDate(periods[0]), parseDate(date));
    return { date, day: ((offset % averageLength) + averageLength) % averageLength + 1 };
  }) : [];
  return {
    cycles, current, eventDates, estimated,
    maxDay: Math.max(28, averageLength, current ? current.length : 0, ...cycles.map(c => c.length)),
    unmapped: [...new Set(data.tensions || [])].filter(d => !valid(d) || !start),
  };
}

function getTensionDay(analysis, day) {
  const observations = analysis.cycles.filter(c => c.length >= day).map(c => {
    const date = isoDate(addDays(parseDate(c.start), day - 1));
    return { start: c.start, date, recorded: analysis.eventDates.has(date) };
  });
  const events = observations.filter(o => o.recorded).length;
  const eligible = observations.length;
  const currentDate = analysis.current && analysis.current.length >= day
    ? isoDate(addDays(parseDate(analysis.current.start), day - 1)) : null;
  return { observations, events, eligible, estimatedDates: analysis.estimated.filter(event => event.day === day).map(event => event.date), rate: eligible ? events / eligible : null,
    currentDate, currentRecorded: !!currentDate && analysis.eventDates.has(currentDate) };
}

let tensionSelectedDay = null;
let tensionDetailsOpen = false;
let tensionMode = null;

function tensionDeleteButton(date) {
  return `<button class="history-del" data-delete-tension="${escapeHTML(date)}" aria-label="Delete tension event ${escapeHTML(date)}">&times;</button>`;
}

function renderTensionMap(analysis) {
  const first = 1, last = analysis.maxDay;
  if (tensionSelectedDay !== null && (tensionSelectedDay < first || tensionSelectedDay > last)) tensionSelectedDay = null;
  const selected = tensionSelectedDay ?? first;
  if (tensionMode === null) tensionMode = analysis.cycles.length ? 'completed' : 'current';
  const current = tensionMode === 'current';
  let html = `<section class="tension-map" aria-label="Recorded tension by cycle day">
    <div class="timeline-title">Recorded tension by cycle day</div>
    <select id="tension-mode" class="heat-mode" aria-label="Tension history view">
      <option value="completed" ${!current ? 'selected' : ''}>completed cycles (${analysis.cycles.length})</option>
      <option value="current" ${current ? 'selected' : ''}>current cycle</option>
    </select>
    <div class="heat-grid" aria-label="${current ? 'Current cycle' : 'Completed cycles'}">`;
  for (let day = first; day <= last; day++) {
    const cell = getTensionDay(analysis, day);
    const isToday = day === analysis.current?.length;
    const coverage = current ? !!cell.currentDate : cell.eligible > 0;
    const events = current ? Number(cell.currentRecorded) : cell.events;
    // Fixed bands: >0–10%, >10–25%, >25–40%, and >40%.
    const level = current ? (events ? 4 : 0) : (!cell.rate ? 0 : cell.rate <= 0.10 ? 1 : cell.rate <= 0.25 ? 2 : cell.rate <= 0.40 ? 3 : 4);
    const label = current
      ? (!coverage ? 'day not reached' : events ? 'event recorded' : 'no event recorded')
      : (coverage ? `${events} events across ${cell.eligible} completed cycles` : 'no completed-cycle coverage');
    const value = !coverage ? '—' : current ? (events ? '●' : '0') : `${events}/${cell.eligible}`;
    html += `<button class="heat-cell ${isToday ? 'is-today ' : ''}${!coverage ? 'no-coverage' : !events ? 'zero-events' : ''}" data-tension-day="${day}" data-level="${level}" aria-pressed="${day === tensionSelectedDay}" ${isToday ? 'aria-current="date"' : ''} aria-label="Day ${day}${isToday ? ' (today)' : ''}: ${label}">${day}<small>${value}</small></button>`;
  }
  html += `</div><p class="heat-note">${current ? '● event recorded · 0 no event recorded · — day not reached' : 'events / completed cycles'}</p>`;
  html += `<button class="today-btn heat-history-btn${tensionDetailsOpen ? ' open' : ''}" id="tension-details-toggle" aria-expanded="${tensionDetailsOpen}" aria-controls="tension-day-details"><span>day details — day ${selected}</span><span class="today-arrow" aria-hidden="true">&#9654;</span></button>`;
  const detail = getTensionDay(analysis, selected);
  html += `<div class="today-card heat-details" id="tension-day-details" ${tensionDetailsOpen ? '' : 'hidden'}>`;
  if (tensionDetailsOpen) {
    const dates = current ? (detail.currentRecorded ? [detail.currentDate] : []) : detail.observations.filter(o => o.recorded).map(o => o.date);
    const rows = dates.map(date => ({ date, estimated: false })).concat(detail.estimatedDates.map(date => ({ date, estimated: true })));
    const eventRow = ({ date, estimated = false }) => `<li><time datetime="${escapeHTML(date)}">${fmtDate(date)}, ${escapeHTML(date.slice(0, 4))}${estimated ? '*' : ''}</time>${tensionDeleteButton(date)}</li>`;
    if (rows.length) html += '<ul>' + rows.map(eventRow).join('') + '</ul>';
    else html += current && !detail.currentDate ? 'Day not reached.' : 'No events logged.';
    if (detail.estimatedDates.length) html += '<p class="heat-note">* Estimated cycle day (before first recorded period).</p>';
    if (analysis.unmapped.length) html += '<p class="heat-note">Unassigned dates</p><ul>' + analysis.unmapped.map(date => eventRow({ date })).join('') + '</ul>';
  }
  return html + '</div></section>';
}

function bindTensionMap() {
  document.querySelectorAll('[data-delete-tension]').forEach(button => {
    button.addEventListener('click', () => confirmDelTension(button.dataset.deleteTension));
  });
  document.getElementById('tension-mode')?.addEventListener('change', event => {
    tensionMode = event.target.value;
    render();
    document.getElementById('tension-mode')?.focus({ preventScroll: true });
  });
  document.getElementById('tension-details-toggle')?.addEventListener('click', () => {
    tensionDetailsOpen = !tensionDetailsOpen;
    render();
    document.getElementById('tension-details-toggle')?.focus({ preventScroll: true });
  });
  document.querySelectorAll('[data-tension-day]').forEach(button => {
    button.addEventListener('click', () => {
      tensionSelectedDay = Number(button.dataset.tensionDay);
      render();
      document.querySelector(`[data-tension-day="${tensionSelectedDay}"]`)?.focus({ preventScroll: true });
    });
  });
}

function getStatus() {
  const data = loadData();
  const preds = getPredictions(data);
  if (!preds) return { empty: true, tension_analysis: getTensionAnalysis(data) };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const cycleDay = daysBetween(preds.lastPeriod, today) + 1;
  const daysLate = Math.max(0, daysBetween(preds.nextPeriod, today));
  let phase = 'normal', phaseLabel = '';
  if (preds.fertileStart <= today && today <= preds.fertileEnd) {
    phase = 'fertile'; phaseLabel = 'ESTIMATED FERTILE WINDOW';
  } else if (today.getTime() === preds.ovulationDay.getTime()) {
    phase = 'fertile'; phaseLabel = 'ESTIMATED OVULATION';
  } else if (preds.pmsStart <= today && today < preds.nextPeriod) {
    phase = 'pms'; phaseLabel = 'ESTIMATED PMS WINDOW';
  } else if (today >= preds.nextPeriod) {
    phase = 'late';
    if (daysLate <= 2) phaseLabel = 'PERIOD EXPECTED';
    else if (daysLate <= 14) phaseLabel = `PERIOD ${daysLate}D LATE`;
    else phaseLabel = `CYCLE PAUSED — ${daysLate}D`;
  }
  const daysToFertile = daysBetween(today, preds.fertileStart);
  const daysToPms = daysBetween(today, preds.pmsStart);
  const daysToPeriod = daysBetween(today, preds.nextPeriod);
  const daysToOvulation = daysBetween(today, preds.ovulationDay);
  const tensionData = getTensionAnalysis(data);
  return {
    empty: false, today: isoDate(today), cycle_day: cycleDay, cycle_length: preds.cycleLength, days_late: daysLate,
    cycle_type: getCycleLengthType(data), last_period: isoDate(preds.lastPeriod),
    next_period: isoDate(preds.nextPeriod), fertile_start: isoDate(preds.fertileStart),
    fertile_end: isoDate(preds.fertileEnd), ovulation_day: isoDate(preds.ovulationDay),
    pms_start: isoDate(preds.pmsStart), phase, phase_label: phaseLabel,
    days_to_fertile: daysToFertile, days_to_pms: daysToPms, days_to_period: daysToPeriod,
    days_to_ovulation: daysToOvulation, total_periods: data.periods.length,
    tension_analysis: tensionData,
  };
}

function getHistory() {
  const data = loadData();
  const periods = [...data.periods].sort();
  const entries = periods.map((p, i) => {
    const entry = { date: p };
    if (i > 0) entry.cycle_length = daysBetween(parseDate(periods[i - 1]), parseDate(p));
    return entry;
  });
  return { entries, average: getCycleLength(data), total_cycles: Math.max(0, periods.length - 1) };
}

// ── UI Helpers ──────────────────────────────────────────────────
const $ = s => document.querySelector(s);

// Only use this helper for HTML text/quoted attributes, never JavaScript or URLs.
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}
function pn() { const d = loadData(); return escapeHTML(d.partner_name || 'she'); }
function pnPoss() { const d = loadData(); return escapeHTML(d.partner_name ? d.partner_name + "'s" : 'her'); }

let toastTimer;
let undoButton = null;
function toast(msg, isError, previousData) {
  clearTimeout(toastTimer);
  const t = $('#toast');
  t.textContent = msg;
  undoButton = null;
  t.className = 'toast show' + (isError ? ' error' : '');
  if (previousData) {
    const savedState = localStorage.getItem(STORAGE_KEY);
    const button = document.createElement('button');
    button.className = 'toast-undo';
    button.textContent = 'undo';
    undoButton = button;
    button.addEventListener('click', () => {
      // A later save or another tab must never be overwritten by an old Undo.
      if (localStorage.getItem(STORAGE_KEY) !== savedState) {
        toast('data changed — undo unavailable', true);
        return;
      }
      if (!saveData(previousData)) return;
      render();
      toast('undone');
    }, { once: true });
    t.appendChild(button);
  }
  toastTimer = setTimeout(() => {
    undoButton?.remove();
    undoButton = null;
    t.className = 'toast';
  }, previousData ? 10000 : 2400);
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

function countdown(days) {
  if (days < 0) return { text: 'past', cls: '' };
  if (days === 0) return { text: 'now', cls: 'active' };
  if (days <= 3) return { text: `${days}d`, cls: 'danger' };
  if (days <= 7) return { text: `${days}d`, cls: 'soon' };
  return { text: `${days}d`, cls: '' };
}

// ── Reassurance Notes ───────────────────────────────────────────
function getEarlyTrackingNote(data) {
  const count = data.periods.length;
  if (count >= 3 || count < 1) return null;
  const notes = {
    1: [
      "marcy is just getting started — initial predictions are based on a general 28-day estimate. <strong>most cycles fall between 21 and 35 days.</strong> it'll get smarter as you log more.",
      "first cycle logged. right now marcy is using a standard estimate. <strong>every cycle you log makes predictions more accurate.</strong>",
      "one data point so far — <strong>marcy will learn her actual pattern over the next few cycles.</strong> don't worry if timing feels off at first.",
    ],
    2: [
      "two cycles tracked — <strong>marcy is starting to learn her rhythm.</strong> predictions are improving but still early. normal cycles range 21–35 days.",
      "getting closer. with two data points, <strong>marcy has its first real calculation.</strong> a few more cycles and predictions will be dialed in.",
      "marcy just calculated its first real cycle length. <strong>patterns usually stabilize after 3–4 tracked cycles.</strong>",
    ],
  };
  return notes[count][dayOfYear() % notes[count].length];
}

function getLateReassurance(daysLate, data) {
  const general = [
    "cycles vary — travel, stress, sleep changes, and time zone shifts can all push things back",
    "a few days' variation is completely normal — cycles aren't clocks",
    "stress, diet changes, illness, or intense exercise can all delay a period by several days",
    "cycle lengths naturally fluctuate — even consistent cycles shift by a few days sometimes",
  ];
  let msg = '';
  if (daysLate <= 2) {
    msg = "should arrive any time now — " + general[dayOfYear() % general.length];
  } else if (daysLate <= 5) {
    msg = general[dayOfYear() % general.length];
  } else if (daysLate <= 10) {
    msg = "this is outside typical variation — a doctor visit may be worth considering if " + pn() + " hasn't already";
  } else if (daysLate <= 14) {
    msg = "pregnancy is a real possibility — a home test can give clarity quickly";
  } else {
    msg = "More than two weeks past the expected date. If pregnancy is possible, take a test if she hasn’t already. If it’s negative and her period still hasn’t arrived, contact a healthcare professional.";
  }
  if (daysLate <= 10 && data.periods.length < 3) {
    msg += " — marcy is still learning her pattern, so the prediction may simply be off";
  }
  return msg;
}

let todayCardOpen = false;
let termsOpen = false;
let currentView = 'dashboard';
let periodHistoryOpen = false;

function getPhaseKey(status) {
  const day = status.cycle_day;
  const data = loadData();
  const lastPeriod = status.last_period;
  const periodEnded = data.period_ends && data.period_ends[lastPeriod];
  if (periodEnded) {
    // Actual end date logged — period ended that day, next day is follicular
    const endDay = daysBetween(parseDate(lastPeriod), parseDate(periodEnded));
    if (day <= endDay) return 'menstrual';
  } else {
    // No end date logged — assume 5 days (medical default)
    if (day <= 5) return 'menstrual';
  }
  if (status.phase === 'fertile') return 'ovulation';
  if (status.phase === 'pms') return 'pms';
  if (status.days_to_pms <= 0 && status.days_to_period > 0) return 'pms';
  if (status.days_to_ovulation < 0 && status.days_to_pms > 0) return 'luteal';
  return 'follicular';
}

function pickVariant(arr, cycleDay) {
  return arr[cycleDay % arr.length];
}

function todayButton(status) {
  const key = getPhaseKey(status);
  const content = todayContent[key];
  const insight = pickVariant(content.insights, status.cycle_day);
  const connect = pickVariant(content.connect, status.cycle_day);
  let html = `<button class="today-btn${todayCardOpen ? ' open' : ''}" onclick="toggleToday()">
    <span>today's read — <span style="color:var(--text-muted)">${content.label}</span></span>
    <span class="today-arrow">&#9654;</span>
  </button>`;
  if (todayCardOpen) {
    html += `<div class="today-card">
      <div class="today-section-label">keep in mind</div>
      <div class="today-text">${insight}</div>
      <div class="today-section-label">how to connect</div>
      <div class="today-text">${connect}</div>
    </div>`;
  }
  return html;
}

function logPeriodEnd() {
  const data = loadData();
  const periods = [...data.periods].sort();
  const lastPeriod = periods[periods.length - 1];
  const today = isoDate(new Date());
  data.period_ends[lastPeriod] = today;
  if (!saveData(data)) return;
  const duration = daysBetween(parseDate(lastPeriod), parseDate(today)) + 1;
  toast(`period logged: ${duration} days`);
  render();
}

function confirmPeriodEnd(cycleDay) {

}

function validLogDate(value) {
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && isoDate(parseDate(value)) === value && value <= isoDate(new Date());
}

function limitLogDate(input) {
  if (!input) return;
  input.max = isoDate(new Date());
  input.addEventListener('input', () => { input.dataset.userEdited = 'true'; });
  input.addEventListener('change', () => { input.dataset.userEdited = 'true'; });
  input.addEventListener('focus', () => { input.max = isoDate(new Date()); });
}

function bindOnboarding() {
  limitLogDate(document.getElementById('onboard-date'));
  const goBtn = document.getElementById('onboard-go');
  const restoreBtn = document.getElementById('onboard-restore');
  const fileInput = document.getElementById('onboard-file');
  if (goBtn) {
    goBtn.addEventListener('click', () => {

      if (!validLogDate(dateVal)) { toast('choose today or an earlier date', true); return; }
      const cycleVal = document.getElementById('onboard-cycle').value;
      const data = loadData();
      data.periods.push(dateVal);
      data.periods.sort();
      data.onboarded = true;
      if (cycleVal) {
        const n = parseInt(cycleVal);
        if (n >= 18 && n <= 45) data.settings.manual_cycle_length = n;
      }
      const nameVal = document.getElementById('onboard-name').value.trim();
      if (nameVal) data.partner_name = nameVal;
      const emailVal = document.getElementById('onboard-email').value.trim();
      if (!saveData(data)) return;

    restoreBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) importData(e.target.files[0]); });
  }
}

let emailSubmissionPending = false;
let emailDraft = '';
async function submitEmail(email) {
  if (emailSubmissionPending) return false;
  emailSubmissionPending = true;
  emailDraft = email;
  const button = document.getElementById('settings-save-email');
  if (button) { button.disabled = true; button.textContent = 'sending…'; }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  let accepted = false;
  try {
    if (!FORMSPREE_URL) throw new Error('Email signup unavailable');
    const response = await fetch(FORMSPREE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email }),
      signal: controller.signal,
    });
    if (!response.ok) throw new Error('Email signup rejected');
    // Read fresh records so edits made while waiting for the server are preserved.
    const data = loadData();
    data.email = email;
    data.email_prompted = true;
    if (!saveData(data)) return false;
    emailDraft = '';
    accepted = true;
  } catch {
    // Keep the draft available in Settings for a retry; do not mark signup complete.
  } finally {
    clearTimeout(timeout);
    emailSubmissionPending = false;
    const retryButton = document.getElementById('settings-save-email');
    if (retryButton) { retryButton.disabled = false; retryButton.textContent = 'sign up'; }
  }
  render();
  toast(accepted ? "thanks — we'll keep you posted" : "couldn't sign up — try again in settings", !accepted);
  return accepted;
}

function skipEmail() {
  const data = loadData();
  data.email_prompted = true;
  if (!saveData(data)) return;
  render();
}

function renderDashboard(status, data) {
  let html = '';
  const daysLate = status.days_late;

  // Phase banner (suppress when paused)
  if (status.phase_label && !data.paused) {
    let subMsg = '';
    if (status.phase === 'pms') subMsg = 'extra patience goes a long way';
    else if (status.phase === 'late') subMsg = getLateReassurance(daysLate, data);
    html += `

        ${subMsg ? `<div class="phase-sub">${subMsg}</div>` : ''}

  }

  // Late period prompt
  if (status.phase === 'late' && !data.paused) {
    html += `
      <div class="late-prompt">
        <div class="late-prompt-top">
          <div class="late-prompt-text">did ${pnPoss()} period start? log it to reset predictions.</div>

          <div class="late-prompt-top">
            <div class="late-prompt-text">not expecting ${pnPoss()} period? pause tracking until ${pnPoss()} cycle resumes.</div>
            <button class="late-prompt-btn" style="background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)" onclick="pauseTracking()">pause</button>
          </div>
        </div>` : ''}
      </div>
    `;
  }

  // Paused state
  if (data.paused) {
    html += `
      <div class="late-prompt">
        <div class="late-prompt-top">
          <div class="late-prompt-text">tracking is paused. when ${pnPoss()} cycle resumes, log ${pnPoss()} next period to restart.</div>
          <button class="late-prompt-btn" onclick="switchView('manage');setTimeout(()=>document.getElementById('log-date')?.scrollIntoView({behavior:'smooth'}),100)">log</button>
        </div>
        <div class="late-prompt-extra" style="margin-top:8px">
          her previous cycle length (${status.cycle_length}d) will be used as a starting point. new cycles will refine predictions from there.
        </div>
      </div>
    `;
  }

  // Phase and period end state (needed by ring meta and period-ended button)
  const phaseKey = getPhaseKey(status);
  const currentPeriodEnded = data.period_ends && data.period_ends[status.last_period];

  // Ring + meta
  const pct = status.phase === 'late' ? 1 : Math.min(status.cycle_day / status.cycle_length, 1);
  const circumference = 2 * Math.PI * 52;
  const offset = circumference * (1 - pct);
  let ringClass = status.phase === 'fertile' ? 'fertile' : status.phase === 'pms' ? 'pms' : '';
  if (status.phase === 'late') ringClass = 'late';
  const cycleLenLabel = status.cycle_type === 'default' ? '(est)' : status.cycle_type === 'manual' ? '(set)' : '';

  html += `
    <div class="ring-section">
      <div class="ring-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-progress ${ringClass}" cx="60" cy="60" r="52"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"/>
        </svg>
        <div class="ring-text">
          <div class="ring-day">${status.phase === 'late' ? (daysLate ? '+' + daysLate : '0') : status.cycle_day}</div>
          <div class="ring-label">${status.phase === 'late' ? (daysLate ? 'past due' : 'due today') : 'of ' + status.cycle_length}</div>
        </div>
      </div>
      <div class="ring-meta">
        last period<br><span>${fmtDate(status.last_period)}${currentPeriodEnded ? ' (' + (daysBetween(parseDate(status.last_period), parseDate(currentPeriodEnded)) + 1) + 'd)' : ''}</span><br>
        cycle length<br><span>${status.cycle_length}d ${cycleLenLabel}</span><br>
        tracked<br><span>${status.total_periods} period${status.total_periods !== 1 ? 's' : ''}</span>
      </div>
    </div>
  `;

  // Period ended button (during menstrual phase, if no end date logged yet)
  if (phaseKey === 'menstrual' && !currentPeriodEnded && status.cycle_day > 1) {
    html += `
      <button class="late-prompt-btn" style="width:100%;background:var(--surface);color:var(--text-dim);border:1px solid var(--border);margin-bottom:32px;padding:12px" onclick="confirmPeriodEnd(${status.cycle_day})">
        ${pnPoss()} period has ended
      </button>
    `;
  }

  // Skip predictions content when paused
  if (data.paused) return html;

  // Early tracking note
  const earlyNote = getEarlyTrackingNote(data);
  if (earlyNote) {
    html += `<div class="learning-note">${earlyNote}</div>`;
  }

  // Today button
  html += todayButton(status);

  // Timeline
  const events = [
    { label: 'Fertile window', date: status.fertile_start, days: status.days_to_fertile, end: status.fertile_end },
    { label: 'Ovulation', date: status.ovulation_day, days: status.days_to_ovulation },
    { label: 'PMS starts', date: status.pms_start, days: status.days_to_pms },
  ];
  events.push({ label: 'Next period', date: status.next_period, days: status.days_to_period });
  events.sort((a, b) => a.days - b.days);

  html += `<div class="timeline"><div class="timeline-title">Upcoming estimates</div>`;
  for (const ev of events) {
    let cd;
    if (ev.end && ev.days < 0) {
      // Range event (like fertile window) — check if we're still inside it
      const daysToEnd = daysBetween(new Date(new Date().setHours(0,0,0,0)), parseDate(ev.end));
      cd = daysToEnd >= 0 ? { text: 'now', cls: 'active' } : { text: 'past', cls: '' };
    } else {
      cd = countdown(ev.days);
    }
    const dateStr = ev.end ? `${fmtDate(ev.date)} – ${fmtDate(ev.end)}` : fmtDate(ev.date);
    html += `
      <div class="timeline-row">
        <div>
          <div class="tl-event">${ev.label}</div>
          <div class="tl-date">${dateStr}</div>
        </div>
        <div class="tl-countdown ${cd.cls}">${cd.text}</div>
      </div>
    `;
  }
  html += `<p class="timeline-note">Timing is estimated. Do not use for contraception.</p></div>`;

  return html;
}

// ── Manage View ─────────────────────────────────────────────────
function renderManage(status, data, history) {
  let html = '';

  // Log forms
  html += `
    <div class="log-section">
      <div class="section-title">log period</div>
      <div class="log-form">
        <input type="date" class="log-input" id="log-date">
        <button class="log-btn" id="log-btn">log</button>
      </div>
    </div>
    <div class="log-section">
      <div class="section-title">log tension</div>
      <div class="log-form">
        <input type="date" class="log-input" id="tension-date">
        <button class="log-btn" id="tension-btn" style="background:var(--yellow);color:var(--bg)">log</button>
      </div>
    </div>
  `;

  // Period history
  if (history.entries.length > 0) {
    html += `<div class="history-section">
      <button class="section-title" style="background:none;border:none;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px" onclick="togglePeriodHistory()">
        <span class="today-arrow" style="font-size:8px;color:var(--text-muted);display:inline-block;transform:rotate(${periodHistoryOpen ? '90deg' : '0deg'});transition:transform 0.2s">&#9654;</span>
        period history — ${history.entries.length}
      </button>`;
    if (periodHistoryOpen) {
      html += `<div class="stat-row">cycles: <span>${history.total_cycles}</span></div>`;
      html += `<div class="stat-row" style="margin-bottom:12px">avg length: <span>${history.average}d</span></div>`;
      for (const e of [...history.entries].reverse()) {
        const lenStr = e.cycle_length ? `${e.cycle_length}d` : '—';
        const periodDur = data.period_ends[e.date] ? (daysBetween(parseDate(e.date), parseDate(data.period_ends[e.date])) + 1) + 'd period' : '';
        html += `
          <div class="history-row">
            <span class="history-date">${fmtDate(e.date)}${periodDur ? ` <span style="color:var(--text-muted)">(${periodDur})</span>` : ''}</span>
            <span class="history-len">${lenStr}</span>
            <button class="history-del" aria-label="Delete period ${escapeHTML(e.date)}" data-delete-period="${escapeHTML(e.date)}">&times;</button>
          </div>
        `;
      }
    }
    html += `</div>`;
  }

  html += renderTensionMap(status.tension_analysis);

  // Settings
  html += `
    <div class="settings-section">
      <div class="section-title">settings</div>
      <div class="settings-row">
        <span class="settings-label">cycle length override</span>
        <div class="settings-value">
          <input type="number" class="settings-input" id="settings-cycle" min="18" max="45"
            placeholder="${data.settings.manual_cycle_length || getCycleLength(data)}"
            value="${data.settings.manual_cycle_length || ''}">
          <button class="settings-save" id="settings-save-cycle">save</button>
        </div>
      </div>
      <div class="settings-row" style="border-bottom:none">
        <span class="settings-label" style="font-size:11px;color:var(--text-muted)">
          ${data.settings.manual_cycle_length ? 'manual override active — clear to use auto-calculation' : 'blank = auto-calculated from logged periods'}
        </span>
        ${data.settings.manual_cycle_length ? '<button class="settings-save" id="settings-clear-cycle">clear</button>' : ''}
      </div>
    </div>
  `;

  // Partner name in settings
  html += `
    <div class="settings-section">
      <div class="section-title">her name</div>
      <div class="settings-row" style="border-bottom:none">
        <input type="text" class="log-input" id="settings-name" maxlength="200" placeholder="leave blank for she/her" value="" style="flex:1" autocomplete="off">
        <button class="settings-save" id="settings-save-name" style="margin-left:8px">save</button>
      </div>
    </div>
  `;

  // Email in settings
  html += `
    <div class="settings-section">
      <div class="section-title">product updates</div>
      <div class="settings-row" style="border-bottom:none">
        ${data.email
          ? `<span class="settings-label" id="email-signup-status">you’re signed up.</span>`
          : `<input type="email" class="log-input" id="settings-email" maxlength="320" placeholder="email@example.com" style="flex:1">
             <button class="settings-save" id="settings-save-email" style="margin-left:8px" ${emailSubmissionPending ? 'disabled' : ''}>${emailSubmissionPending ? 'sending…' : 'sign up'}</button>`
        }
      </div>
      ${!data.email ? '<div style="font-size:10px;color:var(--text-muted);padding-top:4px">Email sent to Formspree</div>' : ''}
    </div>
  `;

  // Share
  html += `
    <div class="settings-section">
      <div class="section-title">share marcy</div>
      <button class="backup-btn" style="width:100%" onclick="shareMarcy()">share with someone</button>
    </div>
  `;

  // Backup
  html += `
    <div class="settings-section">
      <div class="section-title">data</div>
      <div style="font-size:11px;color:var(--text-muted);line-height:1.8;margin-bottom:12px">
        <strong style="color:var(--text-dim);font-weight:500">your data lives on this device only.</strong> Marcy doesn't use accounts or servers — everything is stored locally on your device. Your data will persist through normal use, but it <strong style="color:var(--text-dim);font-weight:500">will be deleted</strong> if you delete the app or reset your device.
        <br><br>
        Export a backup to save a copy of your data as a file. If your data is ever lost, use import to restore it.
      </div>
      <div class="backup-row">
        <button class="backup-btn" onclick="exportData()">export backup</button>
        <button class="backup-btn" onclick="document.getElementById('import-file').click()">import backup</button>

  html += `

      ${termsOpen ? `<div class="terms">
        All predictions are estimates based on general medical conventions regarding average menstrual cycle patterns, including a standard 14-day luteal phase assumption. Every person's cycle is different, and actual timing may vary significantly from these estimates.

        Marcy is not a medical device and is not intended to diagnose, treat, or prevent any condition. This app should not be relied upon for contraception, fertility planning, or any medical decision-making.
        <br><br>
        The developers of Marcy assume no liability for any actions taken or not taken based on information provided by this app. Marcy provides general educational content, not personal advice. You are solely responsible for your own behavior, communication, and decisions in your relationship. Use at your own discretion and consult a healthcare provider for medical advice.
        <br><br>
        Cycle records stay on this device.
      </div>` : ''}
    </div>
  `;

  html += `<div class="footer">marcy &middot; local &middot; private<br><a href="privacy.html">privacy</a><a href="support.html">support</a></div>`;
  return html;
}

// ── Main Render ─────────────────────────────────────────────────
let renderedDay = null;
let dayRefreshTimer;

function render() {
  renderedDay = isoDate(new Date());
  let data;
  try { data = loadData(); }
  catch { renderRecovery(); return; }
  const nav = document.getElementById('bottom-nav');

  // Onboarding
  if (!data.onboarded && data.periods.length === 0) {
    $('#content').innerHTML = renderOnboarding();
    bindOnboarding();
    if (nav) nav.style.display = 'none';
    return;
  }

  // Show nav
  if (nav) nav.style.display = 'flex';
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === currentView);
  });

  const status = getStatus();
  const history = getHistory();

  if (status.empty && currentView === 'dashboard') {
    $('#content').innerHTML = `
      <div class="empty">no data yet.<br>log a period to get started.</div>
      <div class="log-section">
        <div class="section-title">log period</div>
        <div class="log-form">
          <input type="date" class="log-input" id="log-date">
          <button class="log-btn" id="log-btn">log</button>
        </div>
      </div>
    `;
    bindForms();
    return;
  }

  try {
    if (currentView === 'dashboard') {
      $('#content').innerHTML = renderDashboard(status, data);
    } else {
      $('#content').innerHTML = renderManage(status, data, history);
      bindForms();
      bindSettings();
    }
  } catch (e) {
    $('#content').innerHTML = `<div class="empty">something went wrong.<br>${escapeHTML(e.message)}</div>`;
    console.error('Render error:', e);
  }
}

// ── Form Binding ────────────────────────────────────────────────
function bindForms() {
  bindTensionMap();
  document.querySelectorAll('[data-delete-period]').forEach(button => {
    button.addEventListener('click', () => confirmDel(button.dataset.deletePeriod));
  });
  const today = isoDate(new Date());

  const logInput = $('#log-date');
  const logBtn = $('#log-btn');
  if (logInput && logBtn) {
    logInput.value = today;
    limitLogDate(logInput);
    logBtn.addEventListener('click', () => {
      const val = logInput.value;
      if (!validLogDate(val)) { toast('choose today or an earlier date', true); return; }
      const data = loadData();
      if (data.periods.includes(val)) { toast(`${val} already logged`, true); return; }
      const previousData = structuredClone(data);
      const prevCount = data.periods.length;
      const wasPaused = data.paused;
      data.periods.push(val);
      data.periods.sort();
      data.paused = false;
      if (!saveData(data)) return;
      // First real cycle acknowledgment
      if (wasPaused) {
        toast('tracking resumed', false, previousData);
      } else if (prevCount === 1) {
        const cycleLen = getCycleLength(data);
        toast(`first cycle: ${cycleLen} days — marcy is learning`, false, previousData);
      } else {
        toast(`logged ${fmtDate(val)}`, false, previousData);
      }
      currentView = 'dashboard';
      render();
    });
  }

  const tensionInput = $('#tension-date');
  const tensionBtn = $('#tension-btn');
  if (tensionInput && tensionBtn) {
    tensionInput.value = today;
    limitLogDate(tensionInput);
    tensionBtn.addEventListener('click', () => {
      const val = tensionInput.value;
      if (!validLogDate(val)) { toast('choose today or an earlier date', true); return; }
      const data = loadData();
      if (data.tensions.includes(val)) { toast(`${val} already logged`, true); return; }
      const previousData = structuredClone(data);
      data.tensions.push(val);
      data.tensions.sort();
      if (!saveData(data)) return;
      toast(`logged tension ${fmtDate(val)}`, false, previousData);
      currentView = 'manage';
      render();
    });
  }

  // Import file handler
  const importFile = document.getElementById('import-file');
  if (importFile) {
    importFile.addEventListener('change', (e) => { if (e.target.files[0]) importData(e.target.files[0]); });
  }
}

function bindSettings() {
  const displayedData = loadData();
  const emailInput = document.getElementById('settings-email');
  if (emailInput) emailInput.value = emailDraft;
  const nameInput = document.getElementById('settings-name');
  if (nameInput) nameInput.value = displayedData.partner_name || '';

  const saveBtn = document.getElementById('settings-save-cycle');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const input = document.getElementById('settings-cycle');
      const val = input.value.trim();
      const data = loadData();
      if (!val) {
        data.settings.manual_cycle_length = null;
        if (!saveData(data)) return;
        toast('using auto-calculation');
        render();
        return;
      }
      const n = parseInt(val);
      if (n < 18 || n > 45) { toast('cycle length must be 18-45 days', true); return; }
      const auto = getAutoCycleLength(data);
      const diffPct = Math.abs(n - auto) / auto;
      const apply = () => {
        data.settings.manual_cycle_length = n;
        if (!saveData(data)) return;
        toast(`cycle length set to ${n}d`);
        render();
      };
      if (diffPct > 0.2) {
        showConfirm(
          `You entered ${n}d, but her tracked average is ${auto}d — a ${Math.round(diffPct * 100)}% difference.<br><span style="font-size:11px;color:var(--text-dim)">This will override predictions until cleared.</span>`,
          apply,
          'use anyway',
          'confirm-ok'
        );
      } else {
        apply();
      }
    });
  }

  const clearBtn = document.getElementById('settings-clear-cycle');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      const data = loadData();
      data.settings.manual_cycle_length = null;
      if (!saveData(data)) return;
      toast('using auto-calculation');
      render();
    });
  }

  // Name setting
  const saveName = document.getElementById('settings-save-name');
  if (saveName) {
    saveName.addEventListener('click', () => {
      const val = document.getElementById('settings-name').value.trim();
      const data = loadData();
      data.partner_name = val || null;
      if (!saveData(data)) return;
      toast(val ? `personalized for ${val}` : 'using she/her');
      render();
    });
  }

  // Email settings
  const saveEmail = document.getElementById('settings-save-email');
  if (saveEmail) {
    saveEmail.addEventListener('click', () => {
      const input = document.getElementById('settings-email');
      const val = input.value.trim();
      if (!val || !val.includes('@')) { toast('enter a valid email', true); return; }
      submitEmail(val);
    });
  }


}

function confirmDel(dateStr) {
  showConfirm(`Remove period ${escapeHTML(dateStr)}?<br><span style="font-size:11px;color:var(--text-dim)">This will affect cycle calculations.</span>`, () => {
    const data = loadData();
    if (!data.periods.includes(dateStr)) return;
    const previousData = structuredClone(data);
    data.periods = data.periods.filter(p => p !== dateStr);
    delete data.period_ends[dateStr];
    if (!saveData(data)) return;
    toast(`removed ${fmtDate(dateStr)}`, false, previousData);
    render();
  });
}

function confirmDelTension(dateStr) {
  showConfirm(`Remove tension event ${escapeHTML(dateStr)}?`, () => {
    const data = loadData();
    if (!data.tensions.includes(dateStr)) return;
    const previousData = structuredClone(data);
    data.tensions = data.tensions.filter(t => t !== dateStr);
    if (!saveData(data)) return;
    toast(`removed tension ${fmtDate(dateStr)}`, false, previousData);
    render();
  });
}

if (window.Capacitor) document.body.classList.add('native-app');

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── Local Notifications ─────────────────────────────────────────
let notificationQueue = Promise.resolve();
let notificationRevision = 0;
let notificationPermissionRequested = false;

function scheduleNotifications() {
  const plugin = window.Capacitor?.Plugins?.LocalNotifications;
  if (!plugin) return Promise.resolve();
  const revision = ++notificationRevision;
  // Serialize plugin operations so a slow, older schedule cannot overwrite a newer one.
  notificationQueue = notificationQueue.then(async () => {
    if (revision !== notificationRevision) return;
    // Cancel before checking permission or pause: old reminders must still be removed.
    const pending = await plugin.getPending();
    if (pending.notifications.length) await plugin.cancel(pending);
    if (revision !== notificationRevision) return;
    let data;
    try { data = loadData(); } catch { return; }
    if (data.paused || !data.periods.length) return;

    let perm = await plugin.checkPermissions();
    if (revision !== notificationRevision) return;
    if ((perm.display === 'prompt' || perm.display === 'prompt-with-rationale') && !notificationPermissionRequested) {
      notificationPermissionRequested = true;
      perm = await plugin.requestPermissions();
    }
    if (revision !== notificationRevision || perm.display !== 'granted') return;
    const preds = getPredictions(data);
    if (!preds) return;
    const now = new Date();
    const notifications = [];
    function scheduleAt(id, date, title, body) {
      const at = new Date(date);
      at.setHours(9, 0, 0, 0);
      if (at > now) notifications.push({ id, title, body, schedule: { at }, sound: 'default' });
    }
    scheduleAt(1, preds.fertileStart, 'Estimated fertile window', 'Calendar estimate only; do not use for contraception.');
    scheduleAt(2, preds.pmsStart, 'Estimated PMS window', 'Patience and small gestures go a long way this week.');
    if (notifications.length) await plugin.schedule({ notifications });
  }).catch(() => {
    // Keep the queue usable after a plugin error; stored records are already saved.
    toast('could not update reminders — reopen the app to retry', true);
  });
  return notificationQueue;
}

function refreshCalendarDate() {
  if (!document.hidden && isoDate(new Date()) !== renderedDay) {
    const active = document.activeElement;
    const focusedId = active?.id;
    const selection = active && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
    const drafts = [...document.querySelectorAll('#content input[id]:not([type="file"])')].filter(input =>
      input.type !== 'date' || input.dataset.userEdited === 'true' || input.value !== renderedDay
    ).map(input => ({ id: input.id, value: input.value, checked: input.checked, edited: input.dataset.userEdited }));
    const x = window.scrollX, y = window.scrollY;
    render();
    for (const draft of drafts) {
      const input = document.getElementById(draft.id);
      if (!input) continue;
      input.value = draft.value;
      input.checked = draft.checked;
      if (draft.edited) input.dataset.userEdited = draft.edited;
    }
    const focused = focusedId && document.getElementById(focusedId);
    if (focused) {
      focused.focus({ preventScroll: true });
      if (selection) focused.setSelectionRange(...selection);
    }
    window.scrollTo(x, y);
    scheduleNotifications();
  }
  scheduleDayRefresh();
}

function scheduleDayRefresh() {
  clearTimeout(dayRefreshTimer);
  const now = new Date();
  const midnight = new Date(now);
  midnight.setDate(midnight.getDate() + 1);
  midnight.setHours(0, 0, 0, 0);
  dayRefreshTimer = setTimeout(refreshCalendarDate, midnight - now + 50);
}

document.addEventListener('visibilitychange', refreshCalendarDate);
window.addEventListener('focus', refreshCalendarDate);
window.addEventListener('pageshow', refreshCalendarDate);
scheduleNotifications();
render();
scheduleDayRefresh();
</script>
